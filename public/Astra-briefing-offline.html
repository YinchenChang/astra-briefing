`mute`},{key:`opus`,label:`Opus 5 高`,score:30.2,tone:`mute`},{key:`astra`,label:`Astra 嚴格版本`,score:62.7,tone:`teal`},{key:`line`,label:`失效線`,score:80,tone:`warn`},{key:`adapter`,label:`Astra Adapter`,score:98.6,tone:`sand`}],A=[{id:`consumer`,label:`終端消費者`,hop:`$(AI) 產品服務`,closed:!1,body:`下游。大規模為 AI 產品付費並形成回購，目前還沒看到。虛線停在這裡。`},{id:`firm`,label:`企業 / 商家`,hop:`模型與系統導入`,closed:!1,body:`有自家資料、結果能驗證、錯了可回滾的任務，ROI 比較容易轉正。其餘導入仍然難。`},{id:`model`,label:`模型 / 平台商`,hop:`$ 模型採購 $`,closed:!0,body:`中游。API 和系統銷售在轉。這層需求很快，不代表下游已經閉環。`},{id:`infra`,label:`基礎設施`,hop:`$ 算力採購 $`,closed:!0,body:`中上游自己在轉：GPU、HBM、網路、電力。資本和訂單在這裡最快。`}],j=[{key:`form`,t:`能力形成`,verdict:`強化`,last:`AI 進步正由單純擴大預訓練，轉向後訓練、測試時運算與完整 Agent 系統。對企業而言，Agent 能力應理解為 Model × 企業資料 × Harness × Tools／Environment × Verifier × Governance 的聯合系統。只有知識充分、可低成本驗證、錯誤可逆且全載成本合理的任務，才較容易形成可靠閉環；目前以 coding、math、IT Ops 最明確，但 Harness 的泛化與規模化仍未確立。`,now:`同一顆 Astra，嚴格版本 63%、Adapter 99%，差這 36 個百分點。長程訓練確實把一部分 harness 寫進權重了，但缺口還在，系統層沒被吃掉。`},{key:`value`,t:`價值穿透`,verdict:`維持`,last:`模型能力、Agent 用量與傑文斯數量效應，都不自動等於企業利潤。任務效果必須穿透流程、成本移除與價值捕捉，且其經濟性應以每個經驗證成功任務的全載成本衡量。目前從任務效果到企業 EBIT 與自由現金流，仍缺乏普遍證據。`,now:`單位任務更便宜、API 更貴，跟企業 EBIT 還是兩件事。99% 是 Adapter 的分數，拿去講價值穿透會誤導。`},{key:`cap`,t:`資本捕捉`,verdict:`強化`,last:`模型單位經濟為正不代表公司自由現金流為正。OpenAI 的風險主要來自消費補貼、資本承諾、融資需求與價值捕捉，而非 AI 必然無法獲利；若融資依賴持續，風險可能向高槓桿供應商傳導。核心保留是市場可能高估企業 P&L 穿透率及 OpenAI 的最終價值捕捉率。`,now:`所謂最大訓練，會反覆變成 GPU 帳單，而且跑在自己園區。NeoCloud 接到的是剩單。若嚴格版本 63% 和 Adapter 99% 的差距收得太快，外掛能力被模型吃進去了，OpenAI 能留下的價值可能比我們估的高，空頭要減碼。`}],M=[{dir:`Long`,name:`NVIDIA（NVDA）`,weight:`+7.5%`,role:`推論運算與完整平台`,after:`訓練還是 Blackwell。自研推論晶片短期噪音，維持低配`},{dir:`Long`,name:`台積電 ADR（TSM）`,weight:`+10%`,role:`先進製程與先進封裝瓶頸`,after:`先進封裝跟產能還是瓶頸`},{dir:`Long`,name:`Micron（MU）`,weight:`+10%`,role:`HBM、Server DRAM 與 AI 儲存`,after:`長程訓練吃記憶體，方向不變`},{dir:`Long`,name:`Arista Networks（ANET）`,weight:`+10%`,role:`AI cluster 高速網路`,after:`十萬張卡的叢集網路會一直要`},{dir:`Long`,name:`Vertiv（VRT）`,weight:`+10%`,role:`電力、散熱與液冷`,after:`園區訓練把電力散熱訂單坐實了`},{dir:`Short`,name:`Oracle（ORCL）`,weigh
